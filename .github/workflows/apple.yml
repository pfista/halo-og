name: Apple regression checks

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'port/**'
      - 'tools/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'port/**'
      - 'tools/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    # ARM64 guest probes execute on Apple Silicon. These tests use authored
    # fixtures and public dependencies; no maps, Xbox SDK or signing account.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HALO_MACOS_LLVM_BIN: /opt/homebrew/opt/llvm@22/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public toolchain
        run: |
          brew install llvm@22 lld@22 sdl3 ninja
          printf '%s\n' /opt/homebrew/opt/lld@22/bin >> "$GITHUB_PATH"
      - name: Verify runner and prepare dependencies
        run: |
          test "$(uname -m)" = arm64
          python3 tools/macos_setup.py
          python3 tools/macos_build.py --plugin-only
          python3 tools/ios_build.py --plugin-only
      - name: Mac ABI, allocation, networking and audio
        run: python3 tools/test_macos_runtime.py --standalone
      - name: Guest directory and map service imports
        run: python3 -m unittest tools.test_macos_service_imports
      - name: Signed iOS instruction image
        run: python3 tools/test_ios_runtime.py
      - name: Controls, rendering and workload verification
        run: python3 -m unittest tools.test_input_bindings tools.test_controller_settings tools.test_menu_repeat tools.test_visibility_queries tools.test_geometry_cache tools.test_presentation tools.test_macos_preflight tools.test_macos_benchmark
      - name: Version 11 network protocol
        run: python3 -m unittest tools.test_network_pings tools.test_network_v11 tools.test_game_directory tools.test_game_directory_worker
      - name: Input timing and fidelity comparison fixtures
        run: python3 -m unittest tools.test_input_delay tools.test_performance_network tools.test_performance_variants tools.test_performance_console tools.test_performance_runtime tools.test_fiesta_ui tools.test_fiesta_spawn tools.test_halo_fidelity tools.test_meeting_gameplay tools.test_refined_tag_effects
      - name: Spawn inventory, teleports, trails and lifecycle safety
        run: python3 -m unittest tools.test_spawn_inventory tools.test_teleporter_network tools.test_sniper_trail tools.test_weapon_sound_events tools.test_map_lifecycle tools.test_network_client_lifecycle tools.test_stale_player_references
      - name: Native data import and packaging rules
        run: python3 tools/test_macos_menu.py
      - name: App installation and desktop data migration
        run: python3 -m unittest tools.test_macos_installer tools.test_save_migration tools.test_desktop_first_run tools.test_release_discovery tools.test_download_transport_limits tools.test_desktop_map_downloads
      - name: Native Mac release discovery fixtures
        run: python3 tools/test_macos_release_updates.py
      - name: Versioned releases and complete commit changelogs
        run: python3 -m unittest tools.test_testing_release tools.test_release_changelog
      - name: Native community map download fixtures
        run: python3 tools/test_macos_map_downloads.py
      - name: Optional timer recording packs and native downloads
        run: |
          python3 -m unittest tools.test_performance_audio tools.test_timer_audio_pack tools.test_download_timer_audio tools.test_desktop_timer_audio
          python3 tools/test_macos_timer_audio.py
      - name: Managed map lookup and precache readiness
        run: python3 -m unittest tools.test_custom_maps tools.test_map_download_precache tools.test_map_catalog tools.test_publish_map_catalog
      - name: Native Settings keeps the game loop running
        run: python3 tools/test_macos_menu.py --check-ui
