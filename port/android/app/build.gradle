plugins {
    id "com.android.application"
}

// build/android in the repository root, where `ninja android` stages the
// native libraries (jniLibs) and the guest image (assets)
def staged = new File(rootDir, "../../build/android")

// Only upstream main enables the self-updater. Fork CI still needs an
// increasing install version so same-key APKs can upgrade each other.
def buildNumberText = System.getenv("HALO_BUILD_NUMBER") ?: "0"
def buildNumber = buildNumberText.isInteger() ? buildNumberText.toInteger() : 0
def installBuildNumberText = providers.gradleProperty("haloInstallBuildNumber").getOrElse(buildNumberText)
def installBuildNumber = installBuildNumberText.isInteger() ? installBuildNumberText.toInteger() : 0

// Keep the APK's product version aligned with the native menu and Mac bundle.
def versionHeader = new File(rootDir, "../linux/include/halo_og_version.h")
def versionMatcher = versionHeader.getText("UTF-8") =~ /(?m)^[ \t]*#define[ \t]+HALO_OG_VERSION[ \t]+"(\d+(?:\.\d+){0,2})"[ \t]*$/
if (!versionMatcher.find()) {
    throw new GradleException("Expected one numeric HALO_OG_VERSION in " + versionHeader)
}
def haloOgVersion = versionMatcher.group(1)
if (versionMatcher.find()) {
    throw new GradleException("Expected one numeric HALO_OG_VERSION in " + versionHeader)
}

// the workflow's signing key (.github/workflows/build.yml): every build of
// main signed with it can install over the one before; without it, the
// debug key of the computer that builds
def signingKey = System.getenv("HALO_ANDROID_KEYSTORE")

android {
    namespace "com.halo.decomp"
    compileSdk 35

    defaultConfig {
        applicationId "com.halo.decomp.opence"
        minSdk 28
        targetSdk 35
        versionCode Math.max(1, installBuildNumber)
        versionName haloOgVersion
        buildConfigField "int", "HALO_BUILD_NUMBER", "${buildNumber}"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(staged, "third_party/SDL3/android-project/app/src/main/java")
            jniLibs.srcDirs = [new File(staged, "jniLibs")]
            assets.srcDirs = [new File(staged, "assets")]
        }
    }

    // the guest image is read straight from the APK
    androidResources {
        noCompress += ["elf"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingKey) {
            halo {
                storeFile file(signingKey)
                storePassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HALO_ANDROID_KEY_ALIAS") ?: "halo"
                keyPassword System.getenv("HALO_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingKey ? signingConfigs.halo : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
